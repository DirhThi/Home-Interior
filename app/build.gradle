import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'kotlin-parcelize'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.interiordesign3d'
    compileSdk 37

    defaultConfig {
        applicationId "com.interiordesign3d"
        minSdk 31
        targetSdk 37
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables { useSupportLibrary true }
    }

    // Release is signed with the debug key so `assembleRelease` produces an installable APK
    // without a real keystore — swap this for a proper release signingConfig before shipping.
    signingConfigs {
        debug {
            storeFile file("${System.properties['user.home']}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        viewBinding true
    }

    packaging {
        resources { excludes += '/META-INF/{AL2.0,LGPL2.1}'
            pickFirsts += ['lib/x86/libfilament-jni.so', 'lib/x86_64/libfilament-jni.so', 'lib/armeabi-v7a/libfilament-jni.so', 'lib/arm64-v8a/libfilament-jni.so'] }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
        freeCompilerArgs.addAll(
            "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api",
            "-opt-in=androidx.compose.foundation.ExperimentalFoundationApi",
            "-opt-in=androidx.compose.animation.ExperimentalAnimationApi",
        )
    }
}

dependencies {
    // Core
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.activity:activity-compose:1.13.0'

    // Compose BOM
    implementation platform('androidx.compose:compose-bom:2026.08.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.foundation:foundation-layout'

    // Liquid glass (backdrop) — real RenderEffect blur where the backdrop is Compose content
    implementation 'io.github.kyant0:backdrop:2.0.1'

    // Navigation3 + Koin
    implementation 'androidx.navigation3:navigation3-runtime:1.1.6'
    implementation 'androidx.navigation3:navigation3-ui:1.1.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-navigation3:2.11.0'
    implementation 'io.insert-koin:koin-androidx-compose:4.2.2'

    // ViewModel
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'

    // Room Database
    implementation 'androidx.room:room-runtime:2.8.5'
    implementation 'androidx.room:room-ktx:2.8.5'
    ksp 'androidx.room:room-compiler:2.8.5'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Serialization
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.2'

    // Filament 3D Engine (Google's Filament for Android)
    implementation 'com.google.android.filament:filament-android:1.49.1'
    implementation 'com.google.android.filament:filament-utils-android:1.49.1'
    implementation 'com.google.android.filament:gltfio-android:1.49.1'

    // Splash Screen
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // Per-app language. Delegates to the platform API on 33+ and backports it below.
    implementation 'androidx.appcompat:appcompat:1.7.1'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.08.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
